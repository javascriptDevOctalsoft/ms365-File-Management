<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Enterprise Document System</title>
<style>
  body { font-family: Arial, sans-serif; margin: 40px; }
  h1 { color: #0078d4; }
  .container { max-width: 600px; margin: auto; }
  .section { margin-bottom: 30px; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
  label { display: block; margin-top: 10px; }
  input, select { width: 100%; padding: 8px; margin-top: 5px; }
  button { padding: 10px 20px; margin-top: 15px; background-color: #0078d4; color: white; border: none; cursor: pointer; border-radius: 4px; }
  button:hover { background-color: #005a9e; }
  .result { margin-top: 15px; padding: 10px; background: #f2f2f2; border-radius: 4px; }
</style>
</head>
<body>
        <div class="container">
                <h1>Enterprise Document System</h1>
				<!-- <div>Flag: <span id="flag"></span></div> -->
                <!-- Upload Section -->
                <div class="section" id="uploadDoc">
                        <h2>Upload a File</h2>
                        <form id="uploadForm">
                                <label for="file">Select File</label>
                                <input type="file" id="file" name="file" required>
                                <!-- <label for="uploadRole">Select Role for You</label> -->
                                <!-- <select id="uploadRole" name="role"> -->
                                        <!-- <option value="write">Editor</option> -->
                                        <!-- <option value="read">Reader</option> -->
                                <!-- </select> -->
                                <button type="submit">Upload</button>
                        </form>
                        <div id="uploadResult" class="result"></div>
                </div>

                <!-- Create Blank Document Section-->
                <div class="section" id="createDoc">
                        <h2>Create Blank Word Document</h2>
                        <form id="createForm">
                                <label for="fileId">Select Template File</label>
                                <!-- <input type="text" id="fileId" name="fileId" placeholder="Enter document Id" required> -->
								<select id="fileId" name="fileId" required>
									<option value="">Loading templates...</option>
								</select>
                                <!-- <label for="createRole">Select Role for You</label> -->
                                <!-- <select id="createRole" name="role"> -->
									<!-- <option value="write">Editor</option> -->
									<!-- <option value="read">Reader</option> -->
                                <!-- </select> -->
                                <button type="submit">Create</button>
                        </form>
                        <div id="createResult" class="result"></div>
                </div>

                <!-- Generate PDF from Original Document Section-->
                <div class="section" id="convertToPdf">
                        <h2>Generate PDF from Original Document</h2>
                        <form id="generatePdfForm">
                                <label for="pdfFileId">Document Id</label>
                                <input type="text" id="pdfFileId" name="pdfFileId" placeholder="Enter document Id" required>
                                <label for="generatePdfRole">Select Role for You</label>
                                <select id="generatePdfRole" name="role">
                                        <option value="write">Editor</option>
                                        <option value="read">Reader</option>
                                </select>
                                <button type="submit">Convert</button>
                        </form>
                        <div id="generatePdfResult" class="result"></div>
                </div>
        </div>



        <script>
		//syncing data everytime changes is made
		async function syncData(){
			try{
				const syncRes = await fetch(
					"https://bkp2.octalsoft.com/apex/oct_qms_test/dm_api/sync_data",
					{
						method: "GET",
						headers: {
							"Content-Type": "application/json"
						}
					}
				);
				const syncData = await syncRes.json();
				console.log(syncData)
			}catch (err) {
				console.error("Failed to load templates:", err);
			}
		}
		
		
		//update table on uploading a new file
		async function uploadDataToDB(...returnData){
			const [fileID, fileUrl, dbRowId]= returnData
			try{
				const dbUploadRes = await fetch(
					"https://bkp2.octalsoft.com/apex/oct_qms_test/dm_api/ADD_MASTER_DOC_ID",
					{
						method: "POST",
						headers: {
							"Content-Type": "application/json"
						},
						body: JSON.stringify({"FILE_ID":fileID, "FILE_URL":fileUrl, "ID":dbRowId})
					}
				);
				const dbUpdatedData = await dbUploadRes.json();
				console.log("dbUpdatedData------>", dbUpdatedData)
			}catch (err) {
				console.error("Failed to load templates:", err);
			}
		}
		
		
		// Upload Form
		const urlParams = new URLSearchParams(window.location.search);
		const curFlag= urlParams.get('flag');
		const selDocId= urlParams.get('selDocId') || null;
		const fileName= urlParams.get('fileName') || null;
		const verNo= urlParams.get('verNo') || null;
		const savedFlag= urlParams.get('saved') || null;
		const sopType= urlParams.get('sopType') || null;
		const docType= urlParams.get('docType') || null;
		const labSOP= urlParams.get('labSOP') || null;
		console.log("curFlag----->", curFlag)
		if(curFlag == 1){
			loadMasterTemplates();
			syncData();
			document.getElementById("uploadDoc").style.display= "none";
			document.getElementById("createDoc").style.display= "block";
			document.getElementById("convertToPdf").style.display= "none";
		}else if(curFlag == 2){
			document.getElementById("uploadDoc").style.display= "block";
			document.getElementById("createDoc").style.display= "none";
			document.getElementById("convertToPdf").style.display= "none";
		}else if(curFlag == 3){
			document.getElementById("uploadDoc").style.display= "none";
			document.getElementById("createDoc").style.display= "none";
			document.getElementById("convertToPdf").style.display= "block";
		}
		console.log('window.location--->', window.location.search,  urlParams.get('flag'))
		const uploadForm = document.getElementById('uploadForm');
		const uploadResult = document.getElementById('uploadResult');
		
		async function loadMasterTemplates() {
			const fileSelect = document.getElementById("fileId");

			try {
				const response = await fetch(
				"https://bkp2.octalsoft.com/apex/oct_qms_test/dm_api/get_master_template?DOCUMENT_TYPE="+docType+"&SOP_TYPE="+sopType+"&LAB_SOP="+labSOP
				);

				const data = await response.json();
				console.log("Master Templates:", data);

				fileSelect.innerHTML = '<option value="">Select Template</option>';

				const templates = data.items || [];

				templates.forEach(template => {
					const option = document.createElement("option");

					// Remove only the last file extension
					const displayName = template.file_name.replace(/\.[^/.]+$/, "");

					option.value = template.file_id;       // Actual value
					option.textContent = displayName;      // Display without extension

					fileSelect.appendChild(option);
				});
			} catch (err) {
				console.error("Failed to load templates:", err);
				fileSelect.innerHTML = '<option value="">Failed to load templates</option>';
			}
		}
		
		uploadForm.addEventListener('submit', async (e) => {
			e.preventDefault();
			if(savedFlag == 0){
				alert("save the unsaved field in the document template master form")
				return;
			}
			const fileInput = document.getElementById('file');
			<!-- const role = document.getElementById('uploadRole').value; -->
			const role = "write";

			if (!fileInput.files.length) {
				alert('Select a file first');
				return;
			}
			console.log("fileInput.files[0]------>", fileInput.files[0])
			const formData = new FormData();
			formData.append('file', fileInput.files[0]);
			formData.append('role', role);
			formData.append('flag', curFlag);
			formData.append('selDocId', selDocId);
			formData.append('fileName', fileName);
			try {
				const res = await fetch('/upload', {
					method: 'POST',
					body: formData
				});
				const data = await res.json();
				console.log("uploadForm----", data.id);
				uploadDataToDB(data.id, data.webUrl, selDocId);
				//uploadResult.innerHTML = 'File Uploaded! File Id:'+data.id+'<br><a href="'+data.webUrl+'?csf=1&web=1" target="_blank">Open File</a>';
				window.parent.postMessage({ type: "UPLOAD_RESULT", value: "File Uploaded & Synced Successfully "}, "*");
				uploadResult.innerHTML = 'File Uploaded & Synced Successfully!<br><a href="' +       data.webUrl + '?csf=1&web=1" target="_blank">Open File</a>';
			} catch (err) {
				console.error(err);
				uploadResult.innerHTML = '❌ Upload failed';
			}
		});

		// Create Blank Document Form
		const createForm = document.getElementById('createForm');
		const createResult = document.getElementById('createResult');

		createForm.addEventListener('submit', async (e) => {
			e.preventDefault();
			const fileId = document.getElementById('fileId').value;
			<!-- const role = document.getElementById('createRole').value; -->
			const role = "write";

			if (!fileId) {
				alert('Enter document name');
				return;
			}

			try {
				const res = await fetch('/create-blank', {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify({ fileId, role })
				});
				const data = await res.json();
				console.log("result--------->", data, data.webUrl)
				createResult.innerHTML = 'Blank document created! File Id:'+data.id+' <br><a href="'+data.webUrl+'" target="_blank">Open File</a>';
			} catch (err) {
				console.error(err);
				createResult.innerHTML = '❌ Document creation failed';
			}
		});

		// Generate PDF from Original Document
		const generatePdfForm = document.getElementById('generatePdfForm');
		const generatePdfResult = document.getElementById('generatePdfResult');

		generatePdfForm.addEventListener('submit', async (e) => {
			e.preventDefault();
			const pdfFileId = document.getElementById('pdfFileId').value;
			const role = document.getElementById('generatePdfRole').value;

			if (!pdfFileId) {
				alert('Enter document name');
				return;
			}

			try {
				const res = await fetch('/uploadSignedPdf', {
								method: 'POST',
								headers: { 'Content-Type': 'application/json' },
								body: JSON.stringify({ pdfFileId, role })
				});
				const data = await res.json();
				console.log("result--------->", data);
				generatePdfResult.innerHTML = 'PDF created! <br><a href="'+data.webUrl+'" target="_blank">Open File</a>';
			} catch (err) {
				console.error(err);
				generatePdfResult.innerHTML = '❌ Document creation failed';
			}
		});
        </script>
</body>
</html>
